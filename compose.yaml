x-node: &node
  build: .
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  dev:
    <<: *node
    ports:
      - "5173:5173"
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"

  preview:
    <<: *node
    environment:
      BASE_PATH: /sd-bed-frame/
    ports:
      - "4173:4173"
    command: sh -c "pnpm install --frozen-lockfile && pnpm build && pnpm preview --host 0.0.0.0 --port 4173"

  format:
    <<: *node
    command: sh -c "pnpm install --frozen-lockfile && pnpm format"

  lint:
    <<: *node
    command: sh -c "pnpm install --frozen-lockfile && pnpm lint"

  test:
    <<: *node
    command: sh -c "pnpm install --frozen-lockfile && pnpm test"

volumes:
  node_modules:
