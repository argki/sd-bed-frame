<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDベッドフレーム 3DCG</title>
  <style>
    :root {
      --bg: #e8e2d6;
      --panel: #f6f1e7;
      --ink: #241e16;
      --muted: #5c5348;
      --line: #cfc4b0;
      --accent: #7a3f16;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; background: var(--bg); color: var(--ink);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; height: 100dvh; }
    header {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header p { margin: 0; font-size: 12px; color: var(--muted); }
    #toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    button, select {
      font-family: inherit; font-size: 12px; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: 4px;
      padding: 5px 9px; cursor: pointer;
    }
    button.active, button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    #main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
    #main.side-hidden { grid-template-columns: 1fr; }
    #main.side-hidden #side { display: none; }
    #stage { position: relative; z-index: 0; min-width: 0; background: #d9d1c3; isolation: isolate; }
    #view, #draw { position: absolute; inset: 0; overflow: hidden; }
    #draw { display: none; overflow: auto; background: #f3efe6; padding: 16px; }
    #draw.visible { display: block; }
    #view.hidden { visibility: hidden; }
    #hud {
      position: absolute; left: 12px; top: 12px; font-size: 11px; color: var(--muted);
      background: rgba(246,241,231,0.92); padding: 8px 10px; border: 1px solid var(--line);
      line-height: 1.65; pointer-events: none; z-index: 2;
    }
    #side {
      border-left: 1px solid var(--line); background: var(--panel);
      overflow: auto; padding: 12px 14px; font-size: 12px;
    }
    #side h2 { font-size: 11px; margin: 16px 0 8px; letter-spacing: 0.08em; color: var(--muted); }
    #side h2:first-child { margin-top: 0; }
    #part-info { min-height: 86px; padding: 10px; background: #fff; border: 1px solid var(--line); }
    #part-info .id { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .idcell { font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: nowrap; }
    .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 4px; }
    #legend span { display: inline-flex; align-items: center; margin: 0 8px 4px 0; color: var(--muted); }
    .label3d {
      font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600;
      color: #241e16; background: rgba(255,252,246,0.95); border: 1px solid #241e16;
      padding: 1px 4px; white-space: nowrap; pointer-events: none;
    }
    .label3d.dim { color: #7a3f16; border-color: #7a3f16; }
    .sheet { background: #fff; border: 1px solid var(--line); margin: 0 0 16px; padding: 10px 12px 16px; }
    .sheet h3 { margin: 0 0 8px; font-size: 13px; }
    .sheet svg { width: 100%; height: auto; display: block; }
    a { color: var(--accent); }
    @media (max-width: 720px) {
      header { padding: 6px 8px; gap: 8px; }
      header p { display: none; }
      #toolbar { margin-left: 0; }
      #main { grid-template-columns: 1fr; }
      #side {
        position: fixed; left: 0; right: 0; bottom: 0;
        height: 50dvh; max-height: 50dvh; z-index: 20;
        border-left: none; border-top: 1px solid var(--line);
        box-shadow: 0 -8px 24px rgba(36, 30, 22, 0.14);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>セミダブルベッドフレーム 3DCG / 図面</h1>
        <p>単位 mm　2x4=38×89　1x4=19×89　60kg×2名　カインズ多摩境店</p>
      </div>
      <div id="toolbar">
        <button data-page="cg" class="active">3DCG</button>
        <button data-page="draw">2D図面</button>
        <button data-mode="assembled">完成</button>
        <button data-mode="structure" class="active">構造</button>
        <button data-mode="split">上下分離</button>
        <button data-mode="exploded">爆発図</button>
        <button data-mode="joints">接合</button>
        <select id="camera">
          <option value="iso">斜視</option>
          <option value="low">床下斜視</option>
          <option value="top">平面</option>
          <option value="front">正面</option>
          <option value="side">側面</option>
        </select>
        <button id="toggleIds" aria-pressed="true">部材ID</button>
        <button id="toggleDims" aria-pressed="true">寸法</button>
        <button id="toggleBoxes" aria-pressed="false">段ボール</button>
        <button id="toggleSide" aria-pressed="true">一覧</button>
      </div>
    </header>
    <div id="main">
      <div id="stage">
        <div id="hud">外寸 1296 × 2036 × 389<br />床下 300　半体 1018　内寸 1220 × 1960</div>
        <div id="view"></div>
        <div id="draw"></div>
      </div>
      <aside id="side">
        <h2>選択部材</h2>
        <div id="part-info">3DCG上の部材、または右のリストをクリックする。</div>
        <h2>凡例</h2>
        <div id="legend">
          <span><i class="swatch" style="background:#c9a06a"></i>上半身</span>
          <span><i class="swatch" style="background:#b07f4a"></i>下半身</span>
          <span><i class="swatch" style="background:#a67c52"></i>脚</span>
          <span><i class="swatch" style="background:#e6d3a3"></i>受け桟</span>
          <span><i class="swatch" style="background:#d7b57a"></i>すのこ</span>
          <span><i class="swatch" style="background:#d4b06e"></i>結合1x4</span>
          <span><i class="swatch" style="background:#c45c26"></i>ボルト</span>
        </div>
        <h2>木材</h2>
        <div id="part-table"></div>
        <h2>金具</h2>
        <div id="hw-table"></div>
        <h2>接合ID</h2>
        <div id="joint-table"></div>
        <h2>資料</h2>
        <p><a href="../要件定義.md">要件定義</a>　<a href="../設計書.md">設計書</a></p>
      </aside>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

    const T2 = 38, W2 = 89, T1 = 19, W1 = 89;
    const OUTER_W = 1296, OUTER_L = 2036, HALF = 1018, CLEAR = 300, H = 389;
    const SLAT_P = 124.4, SLAT_W = 89, SLAT_L = 1216, BATTEN_L = 960;
    const COLORS = {
      head: 0xc9a06a, foot: 0xb07f4a, joint: 0xd4b06e, leg: 0x8d6233,
      ledger: 0xe6d3a3, slat: 0xd7b57a, plate: 0x6e8aa3, box: 0xc4a574, bolt: 0xc45c26,
    };

    function slats(prefix, x0, module) {
      return Array.from({ length: 8 }, (_, i) => ({
        id: `${prefix}-${String(i + 1).padStart(2, "0")}`,
        name: `${module === "head" ? "上" : "下"}半身スラット ${i + 1}`,
        module, kind: "slat",
        x: x0 + i * SLAT_P, y: 370, z: 40, dx: SLAT_W, dy: T1, dz: SLAT_L, color: COLORS.slat,
      }));
    }

    const PARTS = [
      { id: "F-H", name: "ヘッドレール", module: "head", kind: "frame", x: 0, y: 300, z: 38, dx: T2, dy: W2, dz: 1220, color: COLORS.head },
      { id: "F-J-H", name: "結合横断材 上半身 1x4", module: "head", kind: "frame", x: 999, y: 300, z: 38, dx: T1, dy: W2, dz: 1220, color: COLORS.joint },
      { id: "F-SL-H", name: "左側枠 上半身", module: "head", kind: "frame", x: 0, y: 300, z: 0, dx: 1018, dy: W2, dz: T2, color: COLORS.head },
      { id: "F-SR-H", name: "右側枠 上半身", module: "head", kind: "frame", x: 0, y: 300, z: 1258, dx: 1018, dy: W2, dz: T2, color: COLORS.head },
      { id: "F-CL-H", name: "センターレール 上半身", module: "head", kind: "frame", x: 38, y: 262, z: 629, dx: 961, dy: W2, dz: T2, color: COLORS.head },
      { id: "F-F", name: "フットレール", module: "foot", kind: "frame", x: 1998, y: 300, z: 38, dx: T2, dy: W2, dz: 1220, color: COLORS.foot },
      { id: "F-J-F", name: "結合横断材 下半身 1x4", module: "foot", kind: "frame", x: 1018, y: 300, z: 38, dx: T1, dy: W2, dz: 1220, color: COLORS.joint },
      { id: "F-SL-F", name: "左側枠 下半身", module: "foot", kind: "frame", x: 1018, y: 300, z: 0, dx: 1018, dy: W2, dz: T2, color: COLORS.foot },
      { id: "F-SR-F", name: "右側枠 下半身", module: "foot", kind: "frame", x: 1018, y: 300, z: 1258, dx: 1018, dy: W2, dz: T2, color: COLORS.foot },
      { id: "F-CL-F", name: "センターレール 下半身", module: "foot", kind: "frame", x: 1037, y: 262, z: 629, dx: 961, dy: W2, dz: T2, color: COLORS.foot },
      { id: "L-HL", name: "脚 ヘッド左", module: "head", kind: "leg", x: 38, y: 0, z: 38, dx: T2, dy: H, dz: W2, color: COLORS.leg },
      { id: "L-HC", name: "脚 ヘッド中央", module: "head", kind: "leg", x: 38, y: 0, z: 591, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-HR", name: "脚 ヘッド右", module: "head", kind: "leg", x: 38, y: 0, z: 1169, dx: T2, dy: H, dz: W2, color: COLORS.leg },
      { id: "L-JL-H", name: "脚 結合左 上半身", module: "head", kind: "leg", x: 910, y: 0, z: 38, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-JC-H", name: "脚 結合中 上半身", module: "head", kind: "leg", x: 910, y: 0, z: 591, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-JR-H", name: "脚 結合右 上半身", module: "head", kind: "leg", x: 910, y: 0, z: 1220, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-FL", name: "脚 フット左", module: "foot", kind: "leg", x: 1960, y: 0, z: 38, dx: T2, dy: H, dz: W2, color: COLORS.leg },
      { id: "L-FC", name: "脚 フット中央", module: "foot", kind: "leg", x: 1909, y: 0, z: 591, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-FR", name: "脚 フット右", module: "foot", kind: "leg", x: 1960, y: 0, z: 1169, dx: T2, dy: H, dz: W2, color: COLORS.leg },
      { id: "L-JL-F", name: "脚 結合左 下半身", module: "foot", kind: "leg", x: 1037, y: 0, z: 38, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-JC-F", name: "脚 結合中 下半身", module: "foot", kind: "leg", x: 1037, y: 0, z: 591, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "L-JR-F", name: "脚 結合右 下半身", module: "foot", kind: "leg", x: 1037, y: 0, z: 1220, dx: W2, dy: H, dz: T2, color: COLORS.leg },
      { id: "G-SL-H", name: "左受け桟 上半身", module: "head", kind: "ledger", x: 76, y: 332, z: 38, dx: 834, dy: T1, dz: T1, color: COLORS.ledger },
      { id: "G-SR-H", name: "右受け桟 上半身", module: "head", kind: "ledger", x: 76, y: 332, z: 1239, dx: 834, dy: T1, dz: T1, color: COLORS.ledger },
      { id: "G-SL-F", name: "左受け桟 下半身", module: "foot", kind: "ledger", x: 1126, y: 332, z: 38, dx: 834, dy: T1, dz: T1, color: COLORS.ledger },
      { id: "G-SR-F", name: "右受け桟 下半身", module: "foot", kind: "ledger", x: 1126, y: 332, z: 1239, dx: 834, dy: T1, dz: T1, color: COLORS.ledger },
      { id: "S-H-B1", name: "上半身根太 左", module: "head", kind: "slat", x: 50, y: 351, z: 38, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      { id: "S-H-B2", name: "上半身根太 中", module: "head", kind: "slat", x: 50, y: 351, z: 629, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      { id: "S-H-B3", name: "上半身根太 右", module: "head", kind: "slat", x: 50, y: 351, z: 1169, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      { id: "S-F-B1", name: "下半身根太 左", module: "foot", kind: "slat", x: 1026, y: 351, z: 38, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      { id: "S-F-B2", name: "下半身根太 中", module: "foot", kind: "slat", x: 1026, y: 351, z: 629, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      { id: "S-F-B3", name: "下半身根太 右", module: "foot", kind: "slat", x: 1026, y: 351, z: 1169, dx: BATTEN_L, dy: T1, dz: W1, color: COLORS.slat },
      ...slats("S-H", 50, "head"),
      ...slats("S-F", 1026, "foot"),
    ];

    const HARDWARE = [
      { id: "H-ON25", name: "鬼目ナット Dタイプ", spec: "M8×25", qty: 36 },
      { id: "H-ONJ", name: "鬼目ナット Jタイプ", spec: "M8 脚底", qty: 12 },
      { id: "H-B60", name: "六角ボルト", spec: "M8×60", qty: 44 },
      { id: "H-B50", name: "六角ボルト 合体", spec: "M8×50", qty: 6 },
      { id: "H-N8", name: "六角ナット", spec: "M8", qty: 14 },
      { id: "H-W", name: "平座金", spec: "M8", qty: 64 },
      { id: "H-SW", name: "ばね座金", spec: "M8", qty: 50 },
      { id: "H-AJ", name: "アジャスター", spec: "M8", qty: 12 },
      { id: "H-DW", name: "木ダボ", spec: "φ8×40", qty: 4 },
      { id: "H-CS32", name: "コーススレッド", spec: "3.8×32", qty: 48 },
      { id: "H-CS45", name: "コーススレッド", spec: "3.8×45", qty: 16 },
      { id: "H-FE", name: "フェルトパッド", spec: "脚先", qty: 12 },
    ];

    const JOINTS = [
      { id: "J-01", name: "左ヘッド隅", bolt: "H-B60×2", thru: "F-SL-H", nut: "F-H 鬼目" },
      { id: "J-02", name: "右ヘッド隅", bolt: "H-B60×2", thru: "F-SR-H", nut: "F-H 鬼目" },
      { id: "J-03", name: "上半身 左・F-J-H", bolt: "H-B60×2", thru: "F-SL-H", nut: "F-J-H ナット" },
      { id: "J-04", name: "上半身 右・F-J-H", bolt: "H-B60×2", thru: "F-SR-H", nut: "F-J-H ナット" },
      { id: "J-05", name: "左フット隅", bolt: "H-B60×2", thru: "F-SL-F", nut: "F-F 鬼目" },
      { id: "J-06", name: "右フット隅", bolt: "H-B60×2", thru: "F-SR-F", nut: "F-F 鬼目" },
      { id: "J-07", name: "下半身 左・F-J-F", bolt: "H-B60×2", thru: "F-SL-F", nut: "F-J-F ナット" },
      { id: "J-08", name: "下半身 右・F-J-F", bolt: "H-B60×2", thru: "F-SR-F", nut: "F-J-F ナット" },
      { id: "J-M", name: "合体 F-J-H ↔ F-J-F", bolt: "H-B50×6 + ナット", thru: "F-J-H", nut: "F-J-F" },
    ];

    function bz(id, joint, x, y, z, len) {
      return { id, name: joint, module: "joint", kind: "bolt", joint, x, y: y - 7, z, dx: 14, dy: 14, dz: len, color: COLORS.bolt };
    }
    function bx(id, joint, x, y, z, len) {
      return { id, name: joint, module: "joint", kind: "bolt", joint, x, y: y - 7, z: z - 7, dx: len, dy: 14, dz: 14, color: COLORS.bolt };
    }
    function by(id, joint, x, y, z, len) {
      return { id, name: joint, module: "joint", kind: "bolt", joint, x: x - 7, y, z: z - 7, dx: 14, dy: len, dz: 14, color: COLORS.bolt };
    }
    const BOLTS = [
      bz("J-01a", "J-01", 15, 322, -4, 50), bz("J-01b", "J-01", 15, 367, -4, 50),
      bz("J-02a", "J-02", 15, 322, 1246, 50), bz("J-02b", "J-02", 15, 367, 1246, 50),
      bz("J-03a", "J-03", 1004, 322, -4, 50), bz("J-03b", "J-03", 1004, 367, -4, 50),
      bz("J-04a", "J-04", 1004, 322, 1246, 50), bz("J-04b", "J-04", 1004, 367, 1246, 50),
      bz("J-05a", "J-05", 2013, 322, -4, 50), bz("J-05b", "J-05", 2013, 367, -4, 50),
      bz("J-06a", "J-06", 2013, 322, 1246, 50), bz("J-06b", "J-06", 2013, 367, 1246, 50),
      bz("J-07a", "J-07", 1023, 322, -4, 50), bz("J-07b", "J-07", 1023, 367, -4, 50),
      bz("J-08a", "J-08", 1023, 322, 1246, 50), bz("J-08b", "J-08", 1023, 367, 1246, 50),
      bx("J-Ma", "J-M", 994, 344, 80, 56), bx("J-Mb", "J-M", 994, 344, 300, 56),
      bx("J-Mc", "J-M", 994, 344, 500, 56), bx("J-Md", "J-M", 994, 344, 796, 56),
      bx("J-Me", "J-M", 994, 344, 996, 56), bx("J-Mf", "J-M", 994, 344, 1216, 56),
    ];

    const viewEl = document.getElementById("view");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9d1c3);
    const camera = new THREE.PerspectiveCamera(38, 1, 10, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    viewEl.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    Object.assign(labelRenderer.domElement.style, { position: "absolute", inset: "0", pointerEvents: "none" });
    viewEl.appendChild(labelRenderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.AmbientLight(0xffffff, 0.62));
    const key = new THREE.DirectionalLight(0xfff4e5, 1.15);
    key.position.set(600, 1400, 1200);
    scene.add(key);
    scene.add(new THREE.DirectionalLight(0xc5d4e8, 0.4)).position.set(-1400, 400, -700);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(5000, 3600),
      new THREE.MeshStandardMaterial({ color: 0xcfc6b6, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(1018, -1, 648);
    scene.add(floor);
    const grid = new THREE.GridHelper(4000, 20, 0xb7aa96, 0xc8bdaa);
    grid.position.set(1018, 0, 648);
    scene.add(grid);

    const root = new THREE.Group();
    scene.add(root);
    const meshes = [];
    const idLabels = [];

    function makeLabel(text, cls) {
      const el = document.createElement("div");
      el.className = "label3d" + (cls ? " " + cls : "");
      el.textContent = text;
      return new CSS2DObject(el);
    }

    function addPart(p) {
      const geom = new THREE.BoxGeometry(p.dx, p.dy, p.dz);
      const material = new THREE.MeshStandardMaterial({
        color: p.color, roughness: 0.7, metalness: 0.02,
        transparent: p.kind === "slat", opacity: p.kind === "slat" ? 0.92 : 1,
      });
      const mesh = new THREE.Mesh(geom, material);
      mesh.position.set(p.x + p.dx / 2, p.y + p.dy / 2, p.z + p.dz / 2);
      mesh.userData = p;
      mesh.add(new THREE.LineSegments(
        new THREE.EdgesGeometry(geom),
        new THREE.LineBasicMaterial({ color: 0x2b241c })
      ));
      const label = makeLabel(p.id);
      label.position.set(0, p.dy / 2 + 12, 0);
      mesh.add(label);
      idLabels.push({ obj: label, part: p });
      root.add(mesh);
      meshes.push(mesh);
    }
    PARTS.forEach(addPart);
    BOLTS.forEach(addPart);

      const box = new THREE.Box3();
      meshes.forEach((m) => { if (m.visible) box.expandByObject(m); });
      const t = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      controls.target.copy(t);
      if (name === "top") camera.position.set(t.x, t.y + dist * 1.8, t.z + 8);
      else if (name === "front") camera.position.set(t.x + dist * 1.5, t.y + dist * 0.25, t.z);

      else if (name === "low") camera.position.set(t.x + dist * 0.85, t.y + dist * 0.28, t.z + dist * 0.85);
      else camera.position.set(t.x + dist * 0.95, t.y + dist * 0.55, t.z + dist * 0.95);
      camera.lookAt(t);
      controls.update();
